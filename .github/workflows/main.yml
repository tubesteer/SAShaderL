name: AML Mod Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Download AndroidModLoader's mod template
      run: |
        curl -L -O https://github.com/RusJJ/AndroidModLoader/archive/refs/heads/main.zip
        unzip main.zip
        mv ./AndroidModLoader-main/mod ./mod
          
    - name: Get GTA:SA structures file
      run: |
        # Menggunakan HTTPS untuk clone, pastikan repo ini bersifat public
        git clone https://github.com/RusJJ/GTASAAndroid_Structs.git ./structs
        cp -r ./structs/* ./

    - name: Install Android NDK (r24)
      uses: nttld/setup-ndk@v1.2.0
      with:
        ndk-version: r24
        local-cache: true

    - name: Build the code
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

    - name: Upload the mod!
      uses: actions/upload-artifact@v4
      with:
        name: compiled-mod
        path: ./libs
